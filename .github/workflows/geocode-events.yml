name: Validate event addresses and create map pins

on:
  push:
    branches: [main]
    paths:
      - 'src/content/events/**'
      - 'scripts/geocode-events.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-geocoding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/geocode-events.mjs --write
      - name: Commit validated map coordinates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/events
          git commit -m "content: validate event map locations"
          git push
